name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, unit tests
        run: |
          npm run lint
          npm run typecheck
          npm run test -w shared
          npm run test -w app

      - name: API route tests (Azurite)
        env:
          REQUIRE_AZURITE: '1'
        run: |
          npx azurite --silent --inMemoryPersistence --skipApiVersionCheck --loose --blobPort 10000 --queuePort 10001 --tablePort 10002 &
          node scripts/wait-for.mjs tcp:127.0.0.1:10002 --timeout 60
          npm run test -w api

      - name: Print-ready PDF check
        run: npx tsx scripts/pdf-check.ts /tmp/pdf-check.pdf

      - name: Build app
        env:
          # Public origin for canonical/og:url/sitemap (repository variable, optional).
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build -w app

      - name: Build API (esbuild bundle + production node_modules)
        run: |
          npm run build -w api
          cd api
          # Self-contained package for the managed Functions runtime (Linux, Node 20):
          # only runtime deps, installed inside api/ (not hoisted to the workspace root).
          rm -rf node_modules
          npm install --omit=dev --workspaces=false --no-package-lock --no-audit --no-fund --ignore-scripts
          ls -la dist && du -sh node_modules

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

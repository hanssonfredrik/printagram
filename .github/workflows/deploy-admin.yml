name: Deploy admin

# The admin app (admin/) is a separate Static Web App: printagram-admin-prod (infra/admin.bicep).
# It shares the data layer in api/src/lib and shared/, so changes there redeploy it too.
# Pull requests only run the checks: there are no admin preview environments by design.
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'api/src/lib/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'api/src/lib/**'
      - 'shared/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Test, build and deploy admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck -w admin/api
          npm run typecheck -w admin/app

      - name: Admin API tests (Azurite)
        env:
          REQUIRE_AZURITE: '1'
        run: |
          npx azurite --silent --inMemoryPersistence --skipApiVersionCheck --loose --blobPort 10000 --queuePort 10001 --tablePort 10002 &
          node scripts/wait-for.mjs tcp:127.0.0.1:10002 --timeout 60
          npm run test -w admin/api

      - name: Build admin app
        run: npm run build -w admin/app

      - name: Build admin API (esbuild bundle + production node_modules)
        run: |
          npm run build -w admin/api
          cd admin/api
          rm -rf node_modules
          npm install --omit=dev --workspaces=false --no-package-lock --no-audit --no-fund --ignore-scripts
          ls -la dist && du -sh node_modules

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          action: upload
          app_location: admin/app/dist
          api_location: admin/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
